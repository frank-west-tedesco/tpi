    <script>
        let notasData = [];
        function debug(message) {
            const debugPanel = document.getElementById('debug-panel');
            if (debugPanel) {
                const msgElement = document.createElement('div');
                msgElement.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
                debugPanel.appendChild(msgElement);
                debugPanel.scrollTop = debugPanel.scrollHeight;
            }
            console.log(message);
        }
        // Inicialización de materias
        const materias = [
            "Hardware",
            "Redes",
            "Programación",
            "Autogestión"
        ];

        async function verificarSesion() {
            // Crear un elemento para mostrar mensajes de depuración
            if (!document.getElementById('debug-panel')) {
                const debugPanel = document.createElement('div');
                debugPanel.id = 'debug-panel';
                debugPanel.style.position = 'fixed';
                debugPanel.style.top = '10px';
                debugPanel.style.right = '10px';
                debugPanel.style.width = '300px';
                debugPanel.style.maxHeight = '400px';
                debugPanel.style.overflow = 'auto';
                debugPanel.style.backgroundColor = 'rgba(0,0,0,0.8)';
                debugPanel.style.color = 'white';
                debugPanel.style.padding = '10px';
                debugPanel.style.zIndex = '9999';
                debugPanel.style.fontSize = '12px';
                debugPanel.style.fontFamily = 'monospace';
                document.body.appendChild(debugPanel);
            }
            
            function debug(message) {
                const debugPanel = document.getElementById('debug-panel');
                if (debugPanel) {
                    const msgElement = document.createElement('div');
                    msgElement.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
                    debugPanel.appendChild(msgElement);
                    debugPanel.scrollTop = debugPanel.scrollHeight;
                }
                console.log(message);
            }
            
            try {
                debug('Iniciando verificación de sesión');
                
                // Modo de prueba - Comenta esta sección para activar el modo de prueba
                const urlParams = new URLSearchParams(window.location.search);
                const testMode = urlParams.get('test');
                
                if (testMode === 'true') {
                    debug('Modo de prueba activado');
                    // Datos de prueba para un alumno
                    window.userData = {
                        user: {
                            ID_usuario: 1,
                            nombre: 'Alumno de Prueba',
                            rol: 'alumno'
                        }
                    };
                    debug('Datos de prueba creados: ' + JSON.stringify(window.userData));
                    setTimeout(() => {
                        debug('Llamando a cargarNotas desde modo prueba');
                        cargarNotas();
                    }, 500);
                    return;
                }
                
                // Verificación normal de sesión
                debug('Realizando fetch a /api/sesion');
                const res = await fetch('/api/sesion', {
                    credentials: 'include'
                });
                
                debug('Respuesta de /api/sesion: ' + res.status + ' ' + res.statusText);
                
                if (!res.ok) {
                    debug('Respuesta no OK, redirigiendo a login');
                    // Retrasar la redirección para ver los mensajes de depuración
                    setTimeout(() => {
                        window.location.href = '/LoguinGuevara.html';
                    }, 3000);
                    return;
                }
                
                const userData = await res.json();
                debug('Datos de usuario recibidos: ' + JSON.stringify(userData));
                
                if (!userData.logged || !userData.user || !userData.user.usuario) {
                    debug('Datos de usuario inválidos, redirigiendo a login');
                    // Retrasar la redirección para ver los mensajes de depuración
                    setTimeout(() => {
                        window.location.href = '/LoguinGuevara.html';
                    }, 3000);
                    return;
                }
                
                // Adaptar la estructura de datos para que funcione con el resto del código
                if (!userData.user.ID_usuario) {
                    debug('Adaptando estructura de datos de usuario');
                    if (userData.user.id != null) {
                        userData.user.ID_usuario = parseInt(userData.user.id);
                    }
                }
                
                window.userData = userData; // Guardar datos de usuario globalmente
                debug('Datos de usuario guardados globalmente');
                
                setTimeout(() => {
                    debug('Llamando a cargarNotas');
                    cargarNotas();
                }, 500);
            } catch (error) {
                debug('Error en verificarSesion: ' + error.message);
                // Retrasar la redirección para ver los mensajes de depuración
                setTimeout(() => {
                    window.location.href = '/LoguinGuevara.html';
                }, 3000);
            }
        }

        async function cargarNotas() {
            try {
                let alumnoId = null;

                try {
                    debug('Realizando fetch a /api/alumnos/me');
                    const meRes = await fetch('/api/alumnos/me', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    debug(`Respuesta de /api/alumnos/me: ${meRes.status} ${meRes.statusText}`);
                    if (meRes.ok) {
                        const meData = await meRes.json();
                        alumnoId = meData.id;
                        debug(`Usando alumnoId recibido: ${alumnoId}`);
                    } else {
                        debug('No se pudo obtener alumno actual, usando respaldo');
                    }
                } catch (e) {
                    debug('Error consultando /api/alumnos/me: ' + e.message);
                }

                if (!alumnoId) {
                    alumnoId = 1; // ID de prueba como último recurso
                    debug('Usando ID numérico de prueba: ' + alumnoId);
                }

                debug(`Realizando fetch a /api/notas/${alumnoId}`);
                const notasResponse = await fetch(`/api/notas/${alumnoId}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                debug(`Respuesta de /api/notas: ${notasResponse.status} ${notasResponse.statusText}`);
                if (!notasResponse.ok) {
                    throw new Error('Error al cargar notas');
                }

                const data = await notasResponse.json();
                debug(`Datos recibidos: ${JSON.stringify(data).substring(0, 100)}...`);

                if (Array.isArray(data) && data.length > 0) {
                    notasData = data.map(n => ({
                        materia: n.materia,
                        primer: n.primer ?? null,
                        segundo: n.segundo ?? null,
                        tercero: n.tercero ?? null,
                        comentarios: n.comentarios ?? ""
                    }));
                } else {
                    debug('No se encontraron notas, usando plantilla vacía con materias predefinidas');
                    notasData = materias.map(materia => ({
                        materia,
                        primer: null,
                        segundo: null,
                        tercero: null,
                        comentarios: ""
                    }));
                }

                mostrarNotas();
            } catch (error) {
                debug('Error general en cargarNotas: ' + error.message);
                notasData = materias.map(materia => ({
                    materia,
                    primer: null,
                    segundo: null,
                    tercero: null,
                    comentarios: ""
                }));
                mostrarNotas();
            }
        }

        function mostrarNotas() {
            debug('Iniciando mostrarNotas()');
            debug(`Datos a mostrar: ${JSON.stringify(notasData).substring(0, 100)}...`);
            
            const tbody = document.getElementById('notasTableBody');
            if (!tbody) {
                debug('ERROR: No se encontró el elemento notasTableBody');
                return;
            }
            tbody.innerHTML = '';
            
            let sumaNotas = 0;
            let cantidadNotas = 0;
            
            notasData.forEach(nota => {
                const tr = document.createElement('tr');
                
                // Materia
                const tdMateria = document.createElement('td');
                tdMateria.textContent = nota.materia;
                tr.appendChild(tdMateria);
                
                // Trimestres
                [nota.primer, nota.segundo, nota.tercero].forEach(valor => {
                    const td = document.createElement('td');
                    td.textContent = valor || '-';
                    tr.appendChild(td);
                });
                
                // Promedio
                const tdPromedio = document.createElement('td');
                const valores = [nota.primer, nota.segundo, nota.tercero]
                    .filter(v => v !== null && !isNaN(v))
                    .map(v => parseFloat(v));
                
                if (valores.length > 0) {
                    const promedio = valores.reduce((a, b) => a + b, 0) / valores.length;
                    tdPromedio.textContent = promedio.toFixed(2);
                    sumaNotas += promedio;
                    cantidadNotas++;
                } else {
                    tdPromedio.textContent = '-';
                }
                tr.appendChild(tdPromedio);
                
                // Comentarios
                const tdComentarios = document.createElement('td');
                tdComentarios.textContent = nota.comentarios || '-';
                tr.appendChild(tdComentarios);
                
                tbody.appendChild(tr);
            });
            
            // Actualizar promedio general
            const promedioElement = document.getElementById('promedio');
            if (promedioElement && cantidadNotas > 0) {
                promedioElement.textContent = (sumaNotas / cantidadNotas).toFixed(2);
            }
        }

        // Cerrar sesión
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = "/LoguinGuevara.html";
                } else {
                    console.error("Error logout:", data.message);
                    alert("Error al cerrar sesión: " + data.message);
                }
            } catch (err) {
                console.error("Error de conexión:", err);
                alert("Error de conexión con el servidor.");
            }
        });

        // Inicializar al cargar la página
        window.onload = verificarSesion;
    </script>
